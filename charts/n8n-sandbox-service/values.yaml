imagePullSecrets: []

commonLabels: {}
podAnnotations: {}

auth:
  # Set this to use a Secret created outside this chart.
  # When set, auth.generated is ignored.
  existingSecret: ""
  secretKeys:
    apiKeys: api-keys
    runnerRegistrationToken: runner-registration-token
    runnerApiKey: runner-api-key
    runnerApiKeys: runner-api-keys
  # Used only when existingSecret is empty.
  generated:
    apiKeys: changeme
    runnerRegistrationToken: changeme
    runnerApiKey: changeme
    runnerApiKeys: changeme

dataPlane:
  # Where the data plane runs:
  # - in-cluster: the chart renders a Docker-in-Docker runner StatefulSet.
  #   runner.isolation selects how the runner gets its privileges.
  # - external: runners live outside Kubernetes; the chart renders only the
  #   API resources.
  mode: in-cluster

networkPolicy:
  enabled: false
  api:
    # Controls who can reach the public HTTP API port.
    # When empty, all sources are allowed so an existing ingress controller keeps working.
    httpIngressFrom: []
    # Additional peers allowed to reach the runner registration gRPC port.
    # The in-cluster runner is allowed automatically.
    grpcIngressFrom: []
  runner:
    # Additional peers allowed to reach runner HTTP/control ports.
    # The in-chart API is allowed automatically.
    ingressFrom: []

monitoring:
  serviceMonitor:
    # Requires the Prometheus Operator ServiceMonitor CRD.
    enabled: false
    interval: 30s
    path: /metrics
    scheme: http
    api:
      enabled: true
    runner:
      enabled: true

tls:
  # Choose how the mTLS Secrets are provided: existingSecret or certManager.
  mode: existingSecret
  certManager:
    issuerRef:
      name: ""
      kind: Issuer
      group: cert-manager.io
    duration: 2160h
    renewBefore: 360h
    privateKey:
      rotationPolicy: Always
  certificates:
    apiRegistrationServer:
      secretName: n8n-sandbox-api-registration-tls
      mountPath: /tls/api-registration
      certFileKey: tls.crt
      keyFileKey: tls.key
      caFileKey: ca.crt
      dnsNames: []
    apiControlClient:
      secretName: n8n-sandbox-api-control-client-tls
      mountPath: /tls/api-control-client
      certFileKey: tls.crt
      keyFileKey: tls.key
      caFileKey: ca.crt
      serverName: ""
    runnerRegistrationClient:
      secretName: n8n-sandbox-runner-registration-tls
      mountPath: /tls/runner-registration
      certFileKey: tls.crt
      keyFileKey: tls.key
      caFileKey: ca.crt
      serverName: ""
    runnerControlServer:
      secretName: n8n-sandbox-runner-control-tls
      mountPath: /tls/runner-control
      certFileKey: tls.crt
      keyFileKey: tls.key
      caFileKey: ca.crt
      dnsNames: []

api:
  replicaCount: 1

  image:
    repository: n8nio/n8n-sandbox-service-api
    # Defaults to the chart's appVersion, the version all images share.
    tag: ""
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    httpPort: 8080
    grpcPort: 9090
    annotations: {}

  ingress:
    enabled: false
    className: traefik
    annotations: {}
    hosts:
      - host: sandbox.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

  config:
    listenAddr: ":8080"
    grpcListenAddr: ":9090"
    store: sqlite
    dataDir: /tmp/sandbox-api
    maxFileBytes: "10485760"
    defaultMaxSandboxes: "50"
    enableCors: "false"
    runnerHeartbeatGrace: 45s
    idleStopAfter: 1h
    idleDeleteAfter: 24h
    idleDeleteSafetyBuffer: 1m
    idleSweepInterval: 1m

  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce

  resources: {}
  podSecurityContext:
    fsGroup: 100
    fsGroupChangePolicy: OnRootMismatch
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

# The in-cluster Docker-in-Docker runner, rendered when
# dataPlane.mode=in-cluster. Both isolations run the same runner image; they
# differ only in the source of privilege. Only the subblock that matches
# runner.isolation is read; values in the other subblock are ignored.
runner:
  # How the runner gets the privileges Docker-in-Docker needs:
  # - sysbox: run under the sysbox-runc RuntimeClass. Needs sysbox installed
  #   on the nodes. Recommended.
  # - privileged: run with privileged: true. Any node can run it, including
  #   immutable-rootfs distributions such as Talos, Bottlerocket, Flatcar,
  #   and Fedora CoreOS. Weaker isolation; requires acknowledgePrivileged.
  isolation: sysbox
  # runner.isolation=privileged runs the runner container with
  # privileged: true. An escape from the runner container reaches the node.
  # The namespace needs Pod Security Admission level `privileged`. The render
  # fails until you set this to true.
  acknowledgePrivileged: false

  replicaCount: 1

  image:
    repository: n8nio/n8n-sandbox-service-runner-dind
    # Defaults to the chart's appVersion, the version all images share.
    tag: ""
    pullPolicy: IfNotPresent

  sandboxImage:
    repository: n8nio/n8n-sandbox-service-sandbox
    # Defaults to the chart's appVersion, the version all images share.
    tag: ""
    pullPolicy: IfNotPresent

  dockerConfig:
    existingSecret: ""
    configKey: .dockerconfigjson
    mountPath: /root/.docker

  dockerDataRoot:
    persistence:
      enabled: false
      size: 64Gi
      storageClass: ""
      accessModes:
        - ReadWriteOnce
    # Used only with isolation=privileged when persistence is disabled.
    # Bounds the inner Docker daemon's image layers and sandbox filesystems.
    emptyDir:
      sizeLimit: 64Gi

  service:
    annotations: {}
    httpPort: 8080
    controlGrpcPort: 9091

  # Read only when isolation=sysbox.
  sysbox:
    runtime:
      runtimeClassName: sysbox-runc
      # Set to null to omit the field, for example on CRI-O nodes.
      hostUsers: false
    scheduling:
      nodeSelector:
        sysbox-install: "yes"
      tolerations:
      - key: sysbox-runtime
        operator: Equal
        value: not-running
        effect: NoSchedule
      affinity: {}

  # Read only when isolation=privileged.
  privileged:
    runtime:
      # Optional RuntimeClass for VM-based runtimes such as Kata Containers.
      # Do not set sysbox-runc here; use isolation=sysbox for that.
      runtimeClassName: ""
      # Kubernetes user namespaces (Kubernetes >= 1.33 with containerd >= 2.0).
      # hostUsers: false maps container root to an unprivileged host UID and
      # scopes the privileged capabilities to the pod's user namespace.
      hostUsers: null
    scheduling:
      nodeSelector: {}
      tolerations: []
      affinity: {}

  config:
    listenAddr: ":8080"
    controlGrpcListenAddr: ":9091"
    dockerHost: unix:///var/run/docker.sock
    dataDir: /var/sandboxes
    idleTtlSeconds: "3600"
    capacityTotal: "1000"
    maxFileBytes: "10485760"
    defaultMemoryMb: "512"
    defaultCpuPercent: "100"
    defaultPidsMax: "256"
    defaultDiskQuotaMb: "0"
    diskQuotaPoolSizeGb: ""
    diskQuotaPoolPath: ""
    enableCgroups: "true"
    dockerStorageDriver: ""
    dockerInsecureRegistries: ""

  resources: {}
  podAnnotations: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
