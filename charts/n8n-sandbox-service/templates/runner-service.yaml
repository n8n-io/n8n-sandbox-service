{{- $runner := .Values.runner }}
{{- $component := include "n8n-sandbox-service.runnerComponent" . }}
{{- if eq .Values.dataPlane.mode "in-cluster" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "n8n-sandbox-service.runnerName" . }}
  labels:
    {{- include "n8n-sandbox-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $runner.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  clusterIP: None
  selector:
    {{- include "n8n-sandbox-service.selectorLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: {{ $runner.service.httpPort }}
      targetPort: http
    - name: control-grpc
      port: {{ $runner.service.controlGrpcPort }}
      targetPort: control-grpc
{{- end }}
