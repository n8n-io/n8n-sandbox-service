{{- if hasKey .Values "sysboxRunner" -}}
{{- $old := .Values.sysboxRunner -}}
{{- if and (kindIs "map" $old) (hasKey $old "enabled") (not $old.enabled) -}}
{{- fail "sysboxRunner.enabled=false was replaced: set dataPlane.mode=external to disable the in-cluster runner. See the chart README section 'Migrating from 0.3.x'" -}}
{{- end -}}
{{- fail "sysboxRunner was replaced by the runner block: shared keys keep their names under runner.*; runtime and scheduling moved to runner.sysbox.*. See the chart README section 'Migrating from 0.3.x'" -}}
{{- end -}}
{{- if hasKey .Values "dindRunner" -}}
{{- fail "dindRunner is not a chart value: use the runner block with runner.isolation=privileged. See the chart README section 'Migrating from 0.3.x'" -}}
{{- end -}}
{{- if eq .Values.dataPlane.mode "sysbox" -}}
{{- fail "dataPlane.mode=sysbox was renamed: set dataPlane.mode=in-cluster. sysbox is the default runner.isolation. See the chart README section 'Migrating from 0.3.x'" -}}
{{- end -}}
{{- if eq .Values.dataPlane.mode "dind" -}}
{{- fail "dataPlane.mode=dind was renamed: set dataPlane.mode=in-cluster and runner.isolation=privileged. See the chart README section 'Migrating from 0.3.x'" -}}
{{- end -}}
{{- if not (has .Values.dataPlane.mode (list "in-cluster" "external")) -}}
{{- fail "dataPlane.mode must be one of: in-cluster, external" -}}
{{- end -}}
{{- if not (has .Values.tls.mode (list "existingSecret" "certManager")) -}}
{{- fail "tls.mode must be one of: existingSecret, certManager" -}}
{{- end -}}
{{- if hasKey .Values.runner "enabled" -}}
{{- fail "runner.enabled was removed: set dataPlane.mode=external to disable the in-cluster runner" -}}
{{- end -}}
{{- if hasKey .Values.networkPolicy "sysboxRunner" -}}
{{- fail "networkPolicy.sysboxRunner was renamed: set networkPolicy.runner instead" -}}
{{- end -}}
{{- if hasKey .Values.monitoring.serviceMonitor "sysboxRunner" -}}
{{- fail "monitoring.serviceMonitor.sysboxRunner was renamed: set monitoring.serviceMonitor.runner instead" -}}
{{- end -}}
{{- if not (has .Values.runner.isolation (list "sysbox" "privileged")) -}}
{{- fail "runner.isolation must be one of: sysbox, privileged" -}}
{{- end -}}
{{- if eq .Values.runner.isolation "privileged" -}}
{{- if ne .Values.runner.acknowledgePrivileged true -}}
{{- fail "runner.isolation=privileged runs the runner container with privileged: true. An escape from the runner container reaches the node. The namespace needs Pod Security Admission level `privileged`. Set runner.acknowledgePrivileged=true to accept this trade-off, or use runner.isolation=sysbox on nodes that support sysbox." -}}
{{- end -}}
{{- if eq .Values.runner.privileged.runtime.runtimeClassName "sysbox-runc" -}}
{{- fail "runner.privileged.runtime.runtimeClassName=sysbox-runc conflicts with runner.isolation=privileged: use runner.isolation=sysbox for sysbox nodes" -}}
{{- end -}}
{{- end -}}
{{- if eq .Values.dataPlane.mode "in-cluster" -}}
{{- if not (hasSuffix (printf ":%v" .Values.runner.service.httpPort) .Values.runner.config.listenAddr) -}}
{{- fail "runner.config.listenAddr port must match runner.service.httpPort" -}}
{{- end -}}
{{- if not (hasSuffix (printf ":%v" .Values.runner.service.controlGrpcPort) .Values.runner.config.controlGrpcListenAddr) -}}
{{- fail "runner.config.controlGrpcListenAddr port must match runner.service.controlGrpcPort" -}}
{{- end -}}
{{- end -}}
{{- if and (eq .Values.dataPlane.mode "in-cluster") (gt (int .Values.runner.config.defaultDiskQuotaMb) 0) -}}
{{- $dockerDataRoot := .Values.runner.dockerDataRoot -}}
{{- $chartVolume := or $dockerDataRoot.persistence.enabled (eq .Values.runner.isolation "privileged") -}}
{{- if and (not $chartVolume) (not .Values.runner.config.diskQuotaPoolPath) -}}
{{- fail "runner.config.defaultDiskQuotaMb above 0 needs a bounded volume for the disk-quota pool image, and this configuration has none. The image would land on the container filesystem and could fill the node disk. Set runner.dockerDataRoot.persistence.enabled=true, or set runner.config.diskQuotaPoolPath to a path on a volume you supply through runner.extraVolumes. See the chart README section 'Disk Quotas'" -}}
{{- end -}}
{{- if not (regexMatch "^[1-9][0-9]*$" (toString .Values.runner.config.diskQuotaPoolSizeGb)) -}}
{{- fail (printf "runner.config.diskQuotaPoolSizeGb must be a positive whole number of GB when runner.config.defaultDiskQuotaMb is above 0 (got %q): the derived pool size scales with runner.config.capacityTotal and can outgrow the volume that holds the pool image. See the chart README section 'Disk Quotas'" (toString .Values.runner.config.diskQuotaPoolSizeGb)) -}}
{{- end -}}
{{- if and $chartVolume (not .Values.runner.config.diskQuotaPoolPath) -}}
{{- $volumeSize := ternary $dockerDataRoot.persistence.size (($dockerDataRoot.emptyDir | default dict).sizeLimit | default "") $dockerDataRoot.persistence.enabled | toString -}}
{{- $volumeKey := ternary "runner.dockerDataRoot.persistence.size" "runner.dockerDataRoot.emptyDir.sizeLimit" $dockerDataRoot.persistence.enabled -}}
{{- if not (regexMatch "^[0-9]+Gi?$" $volumeSize) -}}
{{- fail (printf "%s must be a whole number of G or Gi (got %q): the disk-quota pool image lives on that volume, and the chart checks that runner.config.diskQuotaPoolSizeGb fits it" $volumeKey $volumeSize) -}}
{{- end -}}
{{- $volumeSizeGb := trimSuffix "G" (trimSuffix "Gi" $volumeSize) | int -}}
{{- if gt (int .Values.runner.config.diskQuotaPoolSizeGb) $volumeSizeGb -}}
{{- fail (printf "runner.config.diskQuotaPoolSizeGb (%v) must not exceed the docker data root size (%s): the quota pool image lives on that volume" .Values.runner.config.diskQuotaPoolSizeGb $volumeSize) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $apiMetricsAddr := .Values.api.config.metricsListenAddr | default "" | toString | trim -}}
{{- if $apiMetricsAddr -}}
{{- $apiListenAddr := .Values.api.config.listenAddr | toString | trim -}}
{{- $apiGrpcAddr := .Values.api.config.grpcListenAddr | toString | trim -}}
{{/*
Whole-address shape, not just the last segment: net.SplitHostPort rejects a
bare host, and an unbracketed IPv6 address ("::1:9100") for too many colons.
*/}}
{{- if not (regexMatch `^(\[[^]]*\]|[^:]*):[0-9]{1,5}$` $apiMetricsAddr) -}}
{{- fail (printf "api.config.metricsListenAddr must be host:port with a numeric port, e.g. \":9100\" or \"[::]:9100\" (got %q)" $apiMetricsAddr) -}}
{{- end -}}
{{- $apiMetricsPort := last (splitList ":" $apiMetricsAddr) -}}
{{/* Match the range the API accepts, so a bad port fails the render rather than the container. */}}
{{- if or (lt (atoi $apiMetricsPort) 1) (gt (atoi $apiMetricsPort) 65535) -}}
{{- fail (printf "api.config.metricsListenAddr port must be between 1 and 65535 (got %q)" $apiMetricsAddr) -}}
{{- end -}}
{{/*
The comparisons below are numeric, and Helm cannot resolve a service name the
way net.Listen does, so a named port here would silently compare as 0.
*/}}
{{- range $key, $addr := dict "listenAddr" $apiListenAddr "grpcListenAddr" $apiGrpcAddr -}}
{{- if not (regexMatch "^[0-9]{1,5}$" (last (splitList ":" $addr))) -}}
{{- fail (printf "api.config.%s (%q) must use a numeric port when api.config.metricsListenAddr is set, so the chart can tell the ports apart" $key $addr) -}}
{{- end -}}
{{- end -}}
{{- if eq (atoi $apiMetricsPort) (atoi (last (splitList ":" $apiGrpcAddr))) -}}
{{- fail (printf "api.config.metricsListenAddr (%q) must not use the port of api.config.grpcListenAddr (%q): one port cannot serve both" $apiMetricsAddr $apiGrpcAddr) -}}
{{- end -}}
{{- $apiListenPort := last (splitList ":" $apiListenAddr) -}}
{{/*
api.service.httpPort and grpcPort are Service-facing numbers, independent of
the container ports the API binds (api-service.yaml reaches those by name). The
metrics Service port is the container port itself, so it can land on one of
them and leave the Service listing a port twice, which is invalid.
*/}}
{{- if ne (atoi $apiMetricsPort) (atoi $apiListenPort) -}}
{{- $httpServicePort := atoi (toString .Values.api.service.httpPort) -}}
{{- $grpcServicePort := atoi (toString .Values.api.service.grpcPort) -}}
{{- if or (eq (atoi $apiMetricsPort) $httpServicePort) (eq (atoi $apiMetricsPort) $grpcServicePort) -}}
{{- fail (printf "api.config.metricsListenAddr (%q) repeats an API Service port (api.service.httpPort=%v, api.service.grpcPort=%v): a Service cannot list one port twice" $apiMetricsAddr .Values.api.service.httpPort .Values.api.service.grpcPort) -}}
{{- end -}}
{{- end -}}
{{- $metricsHost := trimSuffix "]" (trimPrefix "[" (trimSuffix (printf ":%s" $apiMetricsPort) $apiMetricsAddr)) -}}
{{/* Brackets stripped and wildcards folded together, matching sameListenHost in internal/api/config. */}}
{{- if eq (atoi $apiMetricsPort) (atoi $apiListenPort) -}}
{{- $wildcards := list "" "0.0.0.0" "::" -}}
{{- $listenHost := trimSuffix "]" (trimPrefix "[" (trimSuffix (printf ":%s" $apiListenPort) $apiListenAddr)) -}}
{{- if and (ne $metricsHost $listenHost) (not (and (has $metricsHost $wildcards) (has $listenHost $wildcards))) -}}
{{- fail (printf "api.config.metricsListenAddr (%q) uses the port of api.config.listenAddr (%q) but a different host: leave it empty to serve /metrics on the API listener" $apiMetricsAddr $apiListenAddr) -}}
{{- end -}}
{{- end -}}
{{/*
A ServiceMonitor scrapes the pod IP, which a loopback-only listener never
accepts. Binding loopback is still valid for a sidecar that shares the pod
network namespace, so this only fails when something outside would scrape it.
*/}}
{{- if and .Values.monitoring.serviceMonitor.enabled .Values.monitoring.serviceMonitor.api.enabled -}}
{{- if or (hasPrefix "127." $metricsHost) (eq $metricsHost "localhost") (eq $metricsHost "::1") -}}
{{- fail (printf "api.config.metricsListenAddr (%q) binds loopback, which the API ServiceMonitor cannot scrape: bind all interfaces (\":%s\") or set monitoring.serviceMonitor.api.enabled=false" $apiMetricsAddr $apiMetricsPort) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if not .Values.auth.existingSecret -}}
{{- range $key := list "apiKeys" "runnerRegistrationToken" "runnerApiKey" "runnerApiKeys" -}}
{{- $stringValue := default "" (index $.Values.auth.generated $key) | toString | trim -}}
{{- if or (eq $stringValue "") (eq (lower $stringValue) "changeme") -}}
{{- fail (printf "auth.generated.%s must be set to a non-placeholder value when auth.existingSecret is empty" $key) -}}
{{- end -}}
{{- end -}}
{{- end -}}
