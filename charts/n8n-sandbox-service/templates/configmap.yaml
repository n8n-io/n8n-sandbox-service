apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "n8n-sandbox-service.apiName" . }}-config
  labels:
    {{- include "n8n-sandbox-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
data:
  SANDBOX_API_LISTEN_ADDR: {{ .Values.api.config.listenAddr | quote }}
  SANDBOX_API_GRPC_LISTEN_ADDR: {{ .Values.api.config.grpcListenAddr | quote }}
  SANDBOX_API_STORE: {{ .Values.api.config.store | quote }}
  SANDBOX_API_DATA_DIR: {{ .Values.api.config.dataDir | quote }}
  SANDBOX_API_MAX_FILE_BYTES: {{ .Values.api.config.maxFileBytes | quote }}
  SANDBOX_API_DEFAULT_MAX_SANDBOXES: {{ .Values.api.config.defaultMaxSandboxes | quote }}
  SANDBOX_API_ENABLE_CORS: {{ .Values.api.config.enableCors | quote }}
  SANDBOX_API_METRICS_ENABLED: {{ and .Values.monitoring.serviceMonitor.enabled .Values.monitoring.serviceMonitor.api.enabled | quote }}
  SANDBOX_API_RUNNER_HEARTBEAT_GRACE: {{ .Values.api.config.runnerHeartbeatGrace | quote }}
  SANDBOX_API_IDLE_STOP_AFTER: {{ .Values.api.config.idleStopAfter | quote }}
  SANDBOX_API_IDLE_DELETE_AFTER: {{ .Values.api.config.idleDeleteAfter | quote }}
  SANDBOX_API_IDLE_DELETE_SAFETY_BUFFER: {{ .Values.api.config.idleDeleteSafetyBuffer | quote }}
  SANDBOX_API_IDLE_SWEEP_INTERVAL: {{ .Values.api.config.idleSweepInterval | quote }}
{{- $runner := .Values.runner }}
{{- if eq .Values.dataPlane.mode "in-cluster" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "n8n-sandbox-service.runnerName" . }}-config
  labels:
    {{- include "n8n-sandbox-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ include "n8n-sandbox-service.runnerComponent" . }}
data:
  SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: {{ include "n8n-sandbox-service.sandboxImage" . | quote }}
  SANDBOX_RUNNER_DOCKER_HOST: {{ $runner.config.dockerHost | quote }}
  SANDBOX_RUNNER_LISTEN_ADDR: {{ $runner.config.listenAddr | quote }}
  SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: {{ $runner.config.controlGrpcListenAddr | quote }}
  SANDBOX_RUNNER_DATA_DIR: {{ $runner.config.dataDir | quote }}
  SANDBOX_RUNNER_IDLE_TTL_SECONDS: {{ $runner.config.idleTtlSeconds | quote }}
  SANDBOX_RUNNER_CAPACITY_TOTAL: {{ $runner.config.capacityTotal | quote }}
  SANDBOX_RUNNER_MAX_FILE_BYTES: {{ $runner.config.maxFileBytes | quote }}
  SANDBOX_RUNNER_METRICS_ENABLED: {{ and .Values.monitoring.serviceMonitor.enabled .Values.monitoring.serviceMonitor.runner.enabled | quote }}
  SANDBOX_RUNNER_DEFAULT_MEMORY_MB: {{ $runner.config.defaultMemoryMb | quote }}
  SANDBOX_RUNNER_DEFAULT_CPU_PERCENT: {{ $runner.config.defaultCpuPercent | quote }}
  SANDBOX_RUNNER_DEFAULT_PIDS_MAX: {{ $runner.config.defaultPidsMax | quote }}
  SANDBOX_RUNNER_DEFAULT_DISK_QUOTA_MB: {{ $runner.config.defaultDiskQuotaMb | quote }}
  SANDBOX_RUNNER_ENABLE_CGROUPS: {{ $runner.config.enableCgroups | quote }}
  {{- if $runner.config.dockerStorageDriver }}
  SANDBOX_RUNNER_DOCKER_STORAGE_DRIVER: {{ $runner.config.dockerStorageDriver | quote }}
  {{- end }}
  {{- if $runner.config.diskQuotaPoolSizeGb }}
  SANDBOX_RUNNER_DISK_QUOTA_POOL_SIZE_GB: {{ $runner.config.diskQuotaPoolSizeGb | quote }}
  {{- end }}
  {{- $quotaVolume := and (gt (int $runner.config.defaultDiskQuotaMb) 0) (or $runner.dockerDataRoot.persistence.enabled (eq $runner.isolation "privileged")) }}
  {{- if $runner.config.diskQuotaPoolPath }}
  SANDBOX_RUNNER_DISK_QUOTA_POOL_PATH: {{ $runner.config.diskQuotaPoolPath | quote }}
  {{- else if $quotaVolume }}
  SANDBOX_RUNNER_DISK_QUOTA_POOL_PATH: {{ printf "%s/docker.img" (include "n8n-sandbox-service.runnerDockerDataMountPath" .) | quote }}
  {{- end }}
  {{- if $runner.config.dockerInsecureRegistries }}
  SANDBOX_RUNNER_DOCKER_INSECURE_REGISTRIES: {{ $runner.config.dockerInsecureRegistries | quote }}
  {{- end }}
{{- end }}
