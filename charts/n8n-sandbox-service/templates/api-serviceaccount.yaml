{{- if .Values.api.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "n8n-sandbox-service.apiServiceAccountName" . | quote }}
  labels:
    {{- include "n8n-sandbox-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.api.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The API never calls the Kubernetes API. Workload identity projects its own
# token volume, so it does not need this one.
automountServiceAccountToken: false
{{- end }}
