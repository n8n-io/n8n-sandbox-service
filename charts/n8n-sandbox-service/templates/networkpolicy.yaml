{{- if .Values.networkPolicy.enabled }}
{{- $component := include "n8n-sandbox-service.runnerComponent" . -}}
{{- $runnerEnabled := eq .Values.dataPlane.mode "in-cluster" -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "n8n-sandbox-service.apiName" . }}
  labels:
    {{- include "n8n-sandbox-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      {{- include "n8n-sandbox-service.selectorLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "api") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.networkPolicy.api.httpIngressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if or $runnerEnabled .Values.networkPolicy.api.grpcIngressFrom }}
    - ports:
        - port: grpc
          protocol: TCP
      from:
        {{- if $runnerEnabled }}
        - podSelector:
            matchLabels:
              {{- include "n8n-sandbox-service.selectorLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" $component) | nindent 14 }}
        {{- end }}
        {{- with .Values.networkPolicy.api.grpcIngressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    {{- end }}
{{- if $runnerEnabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "n8n-sandbox-service.runnerName" . }}
  labels:
    {{- include "n8n-sandbox-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  podSelector:
    matchLabels:
      {{- include "n8n-sandbox-service.selectorLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" $component) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
        - port: control-grpc
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "n8n-sandbox-service.selectorLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "api") | nindent 14 }}
        {{- with .Values.networkPolicy.runner.ingressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
{{- end }}
