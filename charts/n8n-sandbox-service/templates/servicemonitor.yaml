{{- if and .Values.monitoring.serviceMonitor.enabled .Values.monitoring.serviceMonitor.api.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "n8n-sandbox-service.apiName" . }}
  labels:
    {{- include "n8n-sandbox-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.monitoring.serviceMonitor.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "n8n-sandbox-service.selectorLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "api") | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.monitoring.serviceMonitor.path | quote }}
      scheme: {{ .Values.monitoring.serviceMonitor.scheme | quote }}
      interval: {{ .Values.monitoring.serviceMonitor.interval | quote }}
      {{- if .Values.monitoring.serviceMonitor.scrapeTimeout }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout | quote }}
      {{- end }}
{{- end }}
{{- $component := include "n8n-sandbox-service.runnerComponent" . }}
{{- if and .Values.monitoring.serviceMonitor.enabled .Values.monitoring.serviceMonitor.runner.enabled (eq .Values.dataPlane.mode "in-cluster") }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "n8n-sandbox-service.runnerName" . }}
  labels:
    {{- include "n8n-sandbox-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.monitoring.serviceMonitor.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "n8n-sandbox-service.selectorLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" $component) | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.monitoring.serviceMonitor.path | quote }}
      {{- $runnerScheme := .Values.monitoring.serviceMonitor.runner.scheme | default .Values.monitoring.serviceMonitor.scheme }}
      scheme: {{ $runnerScheme | quote }}
      {{- $runnerControl := .Values.tls.certificates.runnerControlServer }}
      {{- $runnerTLS := .Values.monitoring.serviceMonitor.runner.tlsConfig }}
      {{- if $runnerTLS }}
      tlsConfig:
        {{- toYaml $runnerTLS | nindent 8 }}
      {{- else if eq $runnerScheme "https" }}
      # Verify against the CA that signs the runner certificate. serverName
      # pins the Service DNS name because targets are scraped by pod IP, which
      # is not a SAN.
      tlsConfig:
        ca:
          secret:
            name: {{ $runnerControl.secretName | quote }}
            key: {{ $runnerControl.caFileKey | quote }}
        serverName: {{ printf "%s.%s.svc.cluster.local" (include "n8n-sandbox-service.runnerName" .) .Release.Namespace | quote }}
      {{- end }}
      interval: {{ .Values.monitoring.serviceMonitor.interval | quote }}
      {{- if .Values.monitoring.serviceMonitor.scrapeTimeout }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout | quote }}
      {{- end }}
{{- end }}
