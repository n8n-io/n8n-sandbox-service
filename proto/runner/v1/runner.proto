syntax = "proto3";

package runner.v1;

option go_package = "github.com/n8n-io/sandbox-service/internal/api/grpc/pb;pb";

service RunnerRegistry {
  rpc Connect(stream RunnerHeartbeat) returns (stream ControlMessage);
}

// SandboxControl: API → runner for sandbox create/stop/delete (HTTP remains for exec/files proxy).
// GetCordon and SetCordon are for operators; they take the same credentials.
service SandboxControl {
  rpc CreateSandbox(CreateSandboxRequest) returns (CreateSandboxResponse);
  rpc StopSandbox(StopSandboxRequest) returns (StopSandboxResponse);
  rpc DeleteSandbox(DeleteSandboxRequest) returns (DeleteSandboxResponse);
  rpc GetCordon(GetCordonRequest) returns (GetCordonResponse);
  rpc SetCordon(SetCordonRequest) returns (SetCordonResponse);
  // GetActivity reports the runner's cordon and what it is still running, for
  // drain.
  rpc GetActivity(GetActivityRequest) returns (GetActivityResponse);
  // UpdateEgressProxy replaces a proxy sandbox's egress spec, for requests
  // the proxy receives afterwards.
  rpc UpdateEgressProxy(UpdateEgressProxyRequest) returns (UpdateEgressProxyResponse);
  // SetModelBlocked blocks or unblocks new requests to a proxy sandbox's model hosts.
  rpc SetModelBlocked(SetModelBlockedRequest) returns (SetModelBlockedResponse);
  // ArchiveSandbox seals a stopped sandbox's disk and uploads it. The sandbox
  // stays on the runner until the API deletes it.
  rpc ArchiveSandbox(ArchiveSandboxRequest) returns (ArchiveSandboxResponse);
  // RestoreSandbox creates a sandbox from an archive, as CreateSandbox would.
  rpc RestoreSandbox(RestoreSandboxRequest) returns (CreateSandboxResponse);
}

message RunnerHeartbeat {
  string runner_id = 1;
  string http_base_url = 2;
  bool healthy = 3;
  int32 capacity_total = 4;
  int32 capacity_used = 5;
  string control_grpc_addr = 6;
  // Managed sandboxes that are stopped and not occupying a concurrent-VM slot.
  int32 capacity_stopped = 7;
  // An operator cordoned the runner: it serves its sandboxes but takes no new
  // creates. Separate from healthy, which is the runtime's own readiness.
  bool cordoned = 8;
  // Sandboxes with a running execution or an open execution stream. The API
  // counts them as active, so the idle sweeper never stops one under a run.
  repeated string active_sandbox_ids = 9;
  // Templates the runner serves; empty from a runner that predates templates,
  // which serves "default" alone.
  repeated TemplateInfo templates = 10;
}

// A template a runner boots sandboxes from, with what one sandbox of it gets.
message TemplateInfo {
  string name = 1;
  int32 vcpus = 2;
  int64 memory_mb = 3;
  int64 disk_mb = 4;
  // The template's build; an archive restores onto the same one.
  string version = 5;
}

message ControlMessage {
  bool ack = 1;
}

message CreateSandboxRequest {
  string sandbox_id = 1;
  string create_options_json = 2;
}

message CreateSandboxResponse {
  string sandbox_id = 1;
  string container_ip = 2;
  // The options the runner applied, encoded like create_options_json. Empty
  // from a runner that predates it, which applied the defaults.
  string applied_create_options_json = 3;
}

message StopSandboxRequest {
  string sandbox_id = 1;
}

message StopSandboxResponse {}

message DeleteSandboxRequest {
  string sandbox_id = 1;
}

message DeleteSandboxResponse {}

message GetCordonRequest {}

message GetCordonResponse {
  bool cordoned = 1;
}

message SetCordonRequest {
  bool cordoned = 1;
}

// The state after the call.
message SetCordonResponse {
  bool cordoned = 1;
}

message GetActivityRequest {}

message GetActivityResponse {
  bool cordoned = 1;
  // Executions the runner started and has not seen end.
  int32 active_executions = 2;
  // Execution streams open through the runner.
  int32 open_streams = 3;
  int32 capacity_total = 4;
  int32 capacity_used = 5;
  int32 capacity_stopped = 6;
}

message UpdateEgressProxyRequest {
  string sandbox_id = 1;
  // An EgressProxySpec, encoded as in create_options_json.
  string egress_proxy_json = 2;
}

message UpdateEgressProxyResponse {}

message SetModelBlockedRequest {
  string sandbox_id = 1;
  bool blocked = 2;
}

message SetModelBlockedResponse {}


message ArchiveSandboxRequest {
  string sandbox_id = 1;
  // Where to PUT the sealed archive; signed by the API, valid for one object.
  string upload_url = 2;
  // The archive's own key (32 bytes).
  bytes key = 3;
}

message ArchiveSandboxResponse {
  // Size and SHA-256 (hex) of the sealed object uploaded.
  int64 size = 1;
  string sha256 = 2;
}

message RestoreSandboxRequest {
  string sandbox_id = 1;
  string create_options_json = 2;
  // Where to GET the sealed archive.
  string download_url = 3;
  bytes key = 4;
}
