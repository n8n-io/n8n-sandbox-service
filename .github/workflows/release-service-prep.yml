name: Service Release Prep

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (ignored when version is set)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Exact version to release (x.y.z). Overrides bump."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prep-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.N8N_ASSISTANT_APP_ID }}
          private-key: ${{ secrets.N8N_ASSISTANT_PRIVATE_KEY }}

      # A bump computed from VERSION collides whenever a past release left VERSION
      # behind — an abandoned version stays reachable by bump forever. The override
      # lets a human name the next version instead of reverse-engineering the input
      # that yields it. set-release-version.sh rejects anything that is not x.y.z.
      - name: Resolve version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          OVERRIDE: ${{ inputs.version }}
        run: |
          CURRENT=$(cat VERSION)
          if [[ -n "$OVERRIDE" ]]; then
            VERSION="$OVERRIDE"
          else
            IFS='.' read -r major minor patch <<< "$CURRENT"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            VERSION="${major}.${minor}.${patch}"
          fi
          bash scripts/set-release-version.sh "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $CURRENT -> $VERSION"

      # Catch a collision here rather than at the branch push, which reports it as
      # an opaque non-fast-forward after the version has already been bumped.
      - name: Fail if version was already released
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          for ref in "refs/tags/service/v${VERSION}" "refs/heads/service/release/${VERSION}"; do
            if [[ -n "$(git ls-remote origin "$ref")" ]]; then
              echo "::error::${ref} already exists. v${VERSION} was already released, or a previous attempt left it behind. Pick a different version or delete the stale ref."
              exit 1
            fi
          done

      - name: Create release branch
        run: git push origin HEAD:refs/heads/service/release/${{ steps.bump.outputs.version }}

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          printf '%s\n' \
            "Automated release PR for sandbox service Docker images v${VERSION}." \
            "" \
            "**Images that will be published:**" \
            "- \`n8nio/n8n-sandbox-service-api:${VERSION}\`" \
            "- \`n8nio/n8n-sandbox-service-runner-dind:${VERSION}\`" \
            "- \`n8nio/n8n-sandbox-service-runner-firecracker:${VERSION}\` (linux/amd64 only)" \
            "- \`n8nio/n8n-sandbox-service-sandbox:${VERSION}\`" \
            "" \
            "All four images share this version and are only supported together." \
            "The Helm chart's \`appVersion\` is bumped to match." \
            "" \
            "Merging this PR will trigger the publish workflow." \
            > /tmp/pr-body.md

          npm ci --prefix .github/scripts
          node .github/scripts/create-signed-commit-pr.mjs \
            --base "service/release/${VERSION}" \
            --branch "service/release-pr/${VERSION}" \
            --title "service: release v${VERSION}" \
            --body-file /tmp/pr-body.md \
            --label "release/service" \
            --message "service: release v${VERSION}" \
            -- VERSION charts/n8n-sandbox-service/Chart.yaml
