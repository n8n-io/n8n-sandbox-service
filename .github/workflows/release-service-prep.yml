name: Service Release Prep

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (ignored when version is set)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Exact version to release (x.y.z). Overrides bump."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

# Serialized, and deliberately not keyed by version: the resolved version is only
# known mid-run, and two runs can reach the same one from different inputs. The
# already-released check below is a read followed by a write, so it is only sound
# while no other prep run is in flight.
concurrency:
  group: release-service-prep
  cancel-in-progress: false

jobs:
  prep-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.N8N_ASSISTANT_APP_ID }}
          private-key: ${{ secrets.N8N_ASSISTANT_PRIVATE_KEY }}

      # A bump computed from VERSION collides whenever a past release left VERSION
      # behind — an abandoned version stays reachable by bump forever. The override
      # lets a human name the next version instead of reverse-engineering the input
      # that yields it. set-release-version.sh rejects anything that is not x.y.z.
      - name: Resolve version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          OVERRIDE: ${{ inputs.version }}
        run: |
          CURRENT=$(cat VERSION)
          if [[ -n "$OVERRIDE" ]]; then
            VERSION="$OVERRIDE"
          else
            IFS='.' read -r major minor patch <<< "$CURRENT"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            VERSION="${major}.${minor}.${patch}"
          fi
          bash scripts/set-release-version.sh "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $CURRENT -> $VERSION"

      # Catch a collision here rather than at the branch push, which reports it as
      # an opaque non-fast-forward after the version has already been bumped.
      - name: Fail if version was already released
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          for ref in "refs/tags/service/v${VERSION}" "refs/heads/service/release/${VERSION}"; do
            # "No such ref" and "origin did not answer" both print nothing, so the
            # exit status is the only thing that distinguishes free from unknown.
            if ! matches=$(git ls-remote origin "$ref"); then
              echo "::error::Could not reach origin to look up ${ref}. Refusing to continue without confirming v${VERSION} is unreleased; re-run once origin is reachable."
              exit 1
            fi
            if [[ -n "$matches" ]]; then
              echo "::error::${ref} already exists. v${VERSION} was already released, or a previous attempt left it behind. Pick a different version or delete the stale ref."
              exit 1
            fi
          done

      # An unused version number is not necessarily a releasable one. VERSION on main
      # lags whenever a release is abandoned, and the override is hand-typed, so both
      # paths can land below the newest release — where every image tag, and latest
      # and stable with them, would silently move backwards. Releases only ever build
      # from the tip of main, so a lower number cannot describe what it ships.
      - name: Fail if version is not newer than the latest release
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          if ! tags=$(git ls-remote --tags --refs origin 'refs/tags/service/v*'); then
            echo "::error::Could not reach origin to list release tags. Refusing to continue without confirming v${VERSION} is newer than the latest release; re-run once origin is reachable."
            exit 1
          fi
          # Staging and prod candidates carry a suffix and are not releases, so they
          # must not raise the floor.
          latest=$(awk -F'service/v' '{print $2}' <<< "$tags" \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [[ -z "$latest" ]]; then
            echo "No prior release tags; v${VERSION} is the first."
            exit 0
          fi
          if [[ "$(printf '%s\n%s\n' "$VERSION" "$latest" | sort -V | head -1)" == "$VERSION" ]]; then
            echo "::error::v${VERSION} is not newer than the latest release v${latest}. Publishing it would move latest and stable backwards onto an older image set. Pick a version above v${latest}."
            exit 1
          fi
          echo "v${VERSION} is newer than the latest release v${latest}"

      - name: Create release branch
        run: git push origin HEAD:refs/heads/service/release/${{ steps.bump.outputs.version }}

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          printf '%s\n' \
            "Automated release PR for sandbox service Docker images v${VERSION}." \
            "" \
            "**Images that will be published:**" \
            "- \`n8nio/n8n-sandbox-service-api:${VERSION}\`" \
            "- \`n8nio/n8n-sandbox-service-runner-dind:${VERSION}\`" \
            "- \`n8nio/n8n-sandbox-service-runner-firecracker:${VERSION}\` (linux/amd64 only)" \
            "- \`n8nio/n8n-sandbox-service-sandbox:${VERSION}\`" \
            "" \
            "All four images share this version and are only supported together." \
            "The Helm chart's \`appVersion\` is bumped to match." \
            "" \
            "Merging this PR will trigger the publish workflow." \
            > /tmp/pr-body.md

          npm ci --prefix .github/scripts
          node .github/scripts/create-signed-commit-pr.mjs \
            --base "service/release/${VERSION}" \
            --branch "service/release-pr/${VERSION}" \
            --title "service: release v${VERSION}" \
            --body-file /tmp/pr-body.md \
            --label "release/service" \
            --message "service: release v${VERSION}" \
            -- VERSION charts/n8n-sandbox-service/Chart.yaml
