name: Release Alpha

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # The tests run before the action logs in, so no token that can push
      # packages is on disk while they do.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Run tests
        uses: ./.github/actions/sandbox-service-test

      - name: Build and push images
        uses: ./.github/actions/dev-image-build-push
        with:
          tags: ${{ github.sha }} alpha
          ghcr-token: ${{ github.token }}
