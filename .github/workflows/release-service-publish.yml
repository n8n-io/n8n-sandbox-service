name: Service Publish

on:
  pull_request:
    types: [closed]
    branches:
      - 'service/release/**'

# The tag, release and post-release PR are created with the release app's
# token, so GITHUB_TOKEN only needs to read the checkout and push to GHCR.
permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    if: github.event.pull_request.merged == true
    runs-on: ${{ vars.RUNNER_PROVIDER == 'github' && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2204' }}
    environment: docker-release
    outputs:
      version: ${{ steps.version.outputs.version }}
      sandbox_digest: ${{ steps.sandbox-image.outputs.digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Read version
        id: version
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          VERSION="${BASE_REF#service/release/}"
          FILE_VERSION=$(tr -d '[:space:]' < VERSION)
          if [[ "$VERSION" != "$FILE_VERSION" ]]; then
            echo "::error::Release branch ${BASE_REF} claims v${VERSION} but VERSION reads ${FILE_VERSION}. Refusing to publish under either version."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # release-metadata only tags at the very end, long after the images are public.
      - name: Fail if version was already released
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! matches=$(git ls-remote origin "refs/tags/service/v${VERSION}"); then
            echo "::error::Could not reach origin to look up service/v${VERSION}. Refusing to publish without confirming it is unreleased; re-run once origin is reachable."
            exit 1
          fi
          if [[ -n "$matches" ]]; then
            echo "::error::service/v${VERSION} already exists, so v${VERSION} was published before. Publishing it again would overwrite its images and move latest and stable onto them."
            exit 1
          fi

      - name: Run tests
        uses: ./.github/actions/sandbox-service-test

      - name: Publish API image
        uses: ./.github/actions/docker-publish
        with:
          image: n8nio/n8n-sandbox-service-api
          ghcr-image: ghcr.io/n8n-io/n8n-sandbox-service-api
          dockerfile: Dockerfile.api
          version: ${{ steps.version.outputs.version }}
          extra-tags: stable
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          ghcr-token: ${{ github.token }}

      - name: Publish runner image
        uses: ./.github/actions/docker-publish
        with:
          image: n8nio/n8n-sandbox-service-runner-dind
          ghcr-image: ghcr.io/n8n-io/n8n-sandbox-service-runner-dind
          dockerfile: Dockerfile.runner-dind
          version: ${{ steps.version.outputs.version }}
          extra-tags: stable
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          ghcr-token: ${{ github.token }}

      - name: Publish Firecracker runner image
        uses: ./.github/actions/docker-publish
        with:
          image: n8nio/n8n-sandbox-service-runner-firecracker
          ghcr-image: ghcr.io/n8n-io/n8n-sandbox-service-runner-firecracker
          dockerfile: Dockerfile.ee.runner-firecracker
          version: ${{ steps.version.outputs.version }}
          platforms: linux/amd64
          extra-tags: stable
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          ghcr-token: ${{ github.token }}

      - name: Publish sandbox image
        id: sandbox-image
        uses: ./.github/actions/docker-publish
        with:
          image: n8nio/n8n-sandbox-service-sandbox
          ghcr-image: ghcr.io/n8n-io/n8n-sandbox-service-sandbox
          dockerfile: Dockerfile.sandbox
          version: ${{ steps.version.outputs.version }}
          extra-tags: stable
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          ghcr-token: ${{ github.token }}

  release-metadata:
    needs: publish-images
    runs-on: ${{ vars.RUNNER_PROVIDER == 'github' && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2204' }}
    env:
      VERSION: ${{ needs.publish-images.outputs.version }}
    steps:
      # Without persist-credentials: false the checkout leaves GITHUB_TOKEN in
      # git's extraheader, which wins over the token in the remote URL below, so
      # the tag would be pushed by github-actions[bot] instead of the release app.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      # The golden build tarball embeds a freshly compiled cmd/daemon; without the
      # test action in this job, nothing else puts Go on the runner.
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.N8N_ASSISTANT_APP_ID }}
          private-key: ${{ secrets.N8N_ASSISTANT_PRIVATE_KEY }}

      - name: Create git tag
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          TAG="service/v${VERSION}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          # Not forced: a released tag must keep pointing at the commit its images
          # and GitHub Release assets were built from.
          git tag "${TAG}"
          git push origin "${TAG}"

      # The bundle pins the guest userspace by the digest the publish job pushed,
      # so a later move of the version tag cannot change what hosts bake.
      - name: Package Firecracker golden build tarball
        env:
          SANDBOX_DIGEST: ${{ needs.publish-images.outputs.sandbox_digest }}
        run: |
          SANDBOX_IMAGE_REF="n8nio/n8n-sandbox-service-sandbox@${SANDBOX_DIGEST}" \
            ./scripts/package-firecracker-golden-build.sh \
            --version "${VERSION}" \
            --output "dist/firecracker-golden-build-${VERSION}.tar.gz"

      # The tarball must go in this one call: gh creates a draft, uploads, then
      # publishes, and the release is immutable from then on — assets cannot be
      # added or replaced afterwards, and the tag can never be reused.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          gh release create "service/v${VERSION}" \
            --title "service v${VERSION}" \
            --notes "## Docker Images

          - \`n8nio/n8n-sandbox-service-api:${VERSION}\`
          - \`n8nio/n8n-sandbox-service-runner-dind:${VERSION}\`
          - \`n8nio/n8n-sandbox-service-runner-firecracker:${VERSION}\` (linux/amd64 only)
          - \`n8nio/n8n-sandbox-service-sandbox:${VERSION}\`

          All four images share this version and are only supported together.

          Platforms: API, runner-dind, and sandbox — \`linux/amd64\`, \`linux/arm64\`. Firecracker runner — \`linux/amd64\` only.

          ## Firecracker golden build

          Download \`firecracker-golden-build-${VERSION}.tar.gz\` from the release assets.
          Use it on runner VMs to rebuild the golden snapshot when upgrading the
          Firecracker runner." \
            "dist/firecracker-golden-build-${VERSION}.tar.gz"

      - name: Open version-bump PR against main
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          bash scripts/set-release-version.sh "${VERSION}"
          npm ci --prefix .github/scripts
          node .github/scripts/create-signed-commit-pr.mjs \
            --base main \
            --branch "service/post-release/${VERSION}" \
            --title "service: bump version to v${VERSION}" \
            --body "Automated post-release PR to update VERSION and the chart appVersion on main after publishing v${VERSION}." \
            --label "release/service" \
            --message "service: bump version to v${VERSION}" \
            -- VERSION charts/n8n-sandbox-service/Chart.yaml
