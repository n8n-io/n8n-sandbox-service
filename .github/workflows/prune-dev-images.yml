name: Prune Dev Images

# Deletes old alpha and staging images from the GHCR -dev packages. The packages
# and the retention rules are in .github/scripts/prune-dev-images.sh.
on:
  schedule:
    # Every day at 04:23 UTC.
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be deleted without deleting it
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: prune-dev-images
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Prune
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: .github/scripts/prune-dev-images.sh
