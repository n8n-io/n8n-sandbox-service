name: SDK Release Prep

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  prep-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - uses: pnpm/action-setup@a0ea98b2dc7d387a59324835f7421c1d5f8357b4 # v6
        with:
          version: 10

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.N8N_ASSISTANT_APP_ID }}
          private-key: ${{ secrets.N8N_ASSISTANT_PRIVATE_KEY }}

      - name: Bump version
        id: bump
        working-directory: sdk
        run: |
          npm version ${{ inputs.bump }} --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync lockfile
        working-directory: sdk
        run: pnpm install --lockfile-only

      - name: Create release branch
        run: git push origin HEAD:refs/heads/sdk/release/${{ steps.bump.outputs.version }}

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          printf '%s\n' \
            "Automated release PR for \`@n8n/sandbox-client@${VERSION}\`." \
            "" \
            "Merging this PR will trigger the SDK publish workflow." \
            > /tmp/pr-body.md

          .github/scripts/create-signed-commit-pr.sh \
            --base "sdk/release/${VERSION}" \
            --branch "sdk/release-pr/${VERSION}" \
            --title "sdk: release v${VERSION}" \
            --body-file /tmp/pr-body.md \
            --label "release/sdk" \
            --message "sdk: release v${VERSION}" \
            -- sdk/package.json sdk/pnpm-lock.yaml
