name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: "1.25.0"

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      # Both tools are pinned so CI and local runs agree. The runner image does
      # preinstall shellcheck, but at a version that lags brew's and still reports
      # findings v0.11.0 dropped (SC2015 on `A && B || true`).
      - name: Install shfmt
        run: go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1

      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | tar -xJ
          sudo install -m 0755 "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          rm -rf "shellcheck-${SHELLCHECK_VERSION}"
          shellcheck --version

      - name: Check shell formatting
        run: make shell-fmt-check

      - name: Lint shell scripts
        run: make shell-lint

      - name: Build
        run: make all

      - name: Test
        run: make test

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - uses: pnpm/action-setup@a0ea98b2dc7d387a59324835f7421c1d5f8357b4 # v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: sdk

      - name: Typecheck
        run: pnpm typecheck
        working-directory: sdk

      - name: Build
        run: pnpm build
        working-directory: sdk

      - name: Test
        run: pnpm test
        working-directory: sdk

  docker:
    runs-on: ${{ vars.RUNNER_PROVIDER == 'github' && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2204' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Build Docker image (amd64)
        run: make docker-amd64

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check Helm
        run: helm version

      - name: Lint chart
        run: helm lint charts/n8n-sandbox-service --set auth.existingSecret=n8n-sandbox-auth

      - name: Render chart variants
        run: |
          helm template n8n-sandbox-service charts/n8n-sandbox-service \
            --set auth.existingSecret=n8n-sandbox-auth
          helm template n8n-sandbox-service charts/n8n-sandbox-service \
            --set auth.existingSecret=n8n-sandbox-auth \
            --set dataPlane.mode=external
          helm template n8n-sandbox-service charts/n8n-sandbox-service \
            --set auth.existingSecret=n8n-sandbox-auth \
            --set tls.mode=certManager \
            --set tls.certManager.issuerRef.name=sandbox-ca \
            --set tls.certManager.issuerRef.kind=ClusterIssuer
          helm template n8n-sandbox-service charts/n8n-sandbox-service \
            --set auth.existingSecret=n8n-sandbox-auth \
            --set api.ingress.enabled=true \
            --set 'api.ingress.hosts[0].host=sandbox.example.com' \
            --set 'api.ingress.tls[0].secretName=sandbox-api-public-tls' \
            --set 'api.ingress.tls[0].hosts[0]=sandbox.example.com'
          helm template n8n-sandbox-service charts/n8n-sandbox-service \
            --set auth.existingSecret=n8n-sandbox-auth \
            --set networkPolicy.enabled=true
          helm template n8n-sandbox-service charts/n8n-sandbox-service \
            --set auth.existingSecret=n8n-sandbox-auth \
            --set dataPlane.mode=external \
            --set networkPolicy.enabled=true
          helm template n8n-sandbox-service charts/n8n-sandbox-service \
            --set auth.existingSecret=n8n-sandbox-auth \
            --set runner.isolation=privileged \
            --set runner.acknowledgePrivileged=true
          helm template n8n-sandbox-service charts/n8n-sandbox-service \
            --set auth.existingSecret=n8n-sandbox-auth \
            --set runner.isolation=privileged \
            --set runner.acknowledgePrivileged=true \
            --set networkPolicy.enabled=true

  golden-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: "1.25.0"

      - name: Install golden-build self-test dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            curl e2fsprogs

      - name: Golden-build bundle self-test
        run: bash scripts/test-firecracker-golden-build-bundle.sh

  e2e:
    uses: ./.github/workflows/e2e.yml

  # This job is required by GitHub branch protection rules.
  # PRs cannot be merged unless this job passes.
  required-checks:
    name: Required Checks
    needs: [check, sdk, docker, helm, golden-build, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Validate required checks
        run: |
          echo "Results: $RESULTS"
          for result in $(echo "$RESULTS" | jq -r '.[] | .result'); do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "One or more required checks failed or were cancelled"
              exit 1
            fi
          done
          echo "All required checks passed"
        env:
          RESULTS: ${{ toJSON(needs) }}
