name: Sandbox Release Prep

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  prep-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.N8N_ASSISTANT_APP_ID }}
          private-key: ${{ secrets.N8N_ASSISTANT_PRIVATE_KEY }}

      - name: Bump version
        id: bump
        run: |
          CURRENT=$(cat SANDBOX_VERSION)
          IFS='.' read -r major minor patch <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          VERSION="${major}.${minor}.${patch}"
          printf '%s' "$VERSION" > SANDBOX_VERSION
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped $CURRENT -> $VERSION"

      - name: Create release branch
        run: git push origin HEAD:refs/heads/sandbox/release/${{ steps.bump.outputs.version }}

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          printf '%s\n' \
            "Automated release PR for sandbox image v${VERSION}." \
            "" \
            "**Image that will be published:**" \
            "- \`n8nio/n8n-sandbox-service-sandbox:${VERSION}\`" \
            "" \
            "Merging this PR will trigger the sandbox image publish workflow." \
            > /tmp/pr-body.md

          .github/scripts/create-signed-commit-pr.sh \
            --base "sandbox/release/${VERSION}" \
            --branch "sandbox/release-pr/${VERSION}" \
            --title "sandbox: release v${VERSION}" \
            --body-file /tmp/pr-body.md \
            --label "release/sandbox" \
            --message "sandbox: release v${VERSION}" \
            -- SANDBOX_VERSION
