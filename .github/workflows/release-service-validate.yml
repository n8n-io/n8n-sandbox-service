name: Service Release Validate

on:
  pull_request:
    branches:
      - 'service/release/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ vars.RUNNER_PROVIDER == 'github' && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2204' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Validate VERSION file and chart appVersion
        run: |
          VERSION=$(cat VERSION)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION contains invalid semver: '$VERSION'"
            exit 1
          fi
          APP_VERSION=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' charts/n8n-sandbox-service/Chart.yaml)
          if [[ "$APP_VERSION" != "$VERSION" ]]; then
            echo "Chart appVersion '$APP_VERSION' does not match VERSION '$VERSION'"
            exit 1
          fi
          echo "Version: $VERSION"

      - name: Run tests
        uses: ./.github/actions/sandbox-service-test

      - name: Build images (amd64, no push)
        run: |
          make docker-api-amd64
          make docker-runner-amd64
          make docker-firecracker-runner-amd64
          make docker-sandbox-amd64
